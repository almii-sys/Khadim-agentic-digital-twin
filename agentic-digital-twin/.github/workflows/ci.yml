name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (flake8)
        run: flake8 app --max-line-length=120 --extend-ignore=E203,W503

      - name: Build mock databases (schema sanity check)
        working-directory: backend/app/mock_data
        run: |
          python seed.py --reset
          python unitime_seed.py --reset

      - name: Run tests
        run: pytest tests/ -v
